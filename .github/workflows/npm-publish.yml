name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out the release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and generated artifacts
        run: make check
      - name: Build and verify publishable packages
        run: |
          npm run build:lib
          npm run release:check
          npm run test:packages
      - name: Publish with provenance
        run: npm run release:publish
